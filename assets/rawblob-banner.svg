<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rb-title rb-desc">
  <title id="rb-title">Rawblob</title>
  <desc id="rb-desc">Forensic file carving and reconstruction, entirely in your browser. Zero server-side storage.</desc>

  <defs>
    <radialGradient id="rb-glow" cx="22%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#E8A33D" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#E8A33D" stop-opacity="0"/>
