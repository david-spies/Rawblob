      <stop offset="50%" stop-color="#E8A33D" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E8A33D" stop-opacity="0"/>
    </linearGradient>
    <filter id="rb-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <clipPath id="rb-round">
      <rect x="1" y="1" width="1198" height="258" rx="14"/>
    </clipPath>
  </defs>

